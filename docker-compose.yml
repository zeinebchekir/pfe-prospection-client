services:
  db:
    image: postgres:15-alpine
    container_name: crmpfe_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crmpfe_network
  # Base de données dédiée au service IA-ML
  db_iaml:
    image: postgres:15-alpine
    container_name: crmpfe_db_iaml
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IAML_DB_NAME:-iaml_db}
      POSTGRES_USER: ${IAML_DB_USER:-iaml_user}
      POSTGRES_PASSWORD: ${IAML_DB_PASSWORD:-iaml_pass}
    volumes:
      - iaml_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IAML_DB_USER:-iaml_user} -d ${IAML_DB_NAME:-iaml_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iaml_network
      - etl_network  # Permet à l'ETL de lire/écrire ici si besoin             

  pgadmin:
    image: dpage/pgadmin4
    container_name: crmpfe_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crmpfe_network

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crmpfe_web
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crmpfe_network

  frontend:
    image: node:20-alpine
    container_name: crmpfe_frontend
    working_dir: /app
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_PROXY_TARGET: "http://web:8000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5174:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - web
    networks:
      - crmpfe_network
    shm_size: '256mb'  

  ia-ml:
    build:
      context: ./IA-ML_service
      dockerfile: dockerfile
    container_name: crmpfe_iaml
    restart: unless-stopped
    depends_on:
      db_iaml:
        condition: service_healthy
    environment:
      # L'URL pointe maintenant vers le nom du service "db_iaml"
      DATABASE_URL: postgresql://${IAML_DB_USER:-iaml_user}:${IAML_DB_PASSWORD:-iaml_pass}@db_iaml:5432/${IAML_DB_NAME:-iaml_db}
    networks:
      - iaml_network     # Pour parler à sa DB
      - crmpfe_network   # Pour parler au Web (Django)
      - etl_network      # Pour être joint par Airflow/FastAPI de l'autre compose
volumes:
  postgres_data:
  static_volume:
  ollama_data:
  iaml_pgdata:

networks:
  crmpfe_network:
    driver: bridge
  iaml_network:
    driver: bridge
  etl_network:
    external: true
    name: etl_service_default 
